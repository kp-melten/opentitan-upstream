schema: swb-campaign-support/v0
support_profile_id: opentitan-dma
campaign_id: dma-memory-protection-closure-f96de0c2d41b
campaign_path: campaigns/dma-memory-protection-closure-f96de0c2d41b
support_root: campaigns/dma-memory-protection-closure-f96de0c2d41b/swb-support

# SWB-owned common tools used by this campaign. Tool IDs match `swb tool run <tool-id>`.
swb_tools: []

# Campaign or repo-owned helper scripts/wrappers. Paths must stay inside the workspace.
repo_tools:
  - path: campaigns/dma-memory-protection-closure-f96de0c2d41b/swb-support/checks/run_dma_footprint_xsim.sh
    purpose: Generate the DMA dependency graph and run the focused XSim footprint check.
    prerequisites:
      env:
        PATH_prefix:
          - /data/tools/Xilinx/2025.2.1/Vivado/bin
      notes:
        - Pass an empty output directory below the campaign checks surface.
        - The runner defines SYNTHESIS because XSim does not support OpenTitan assertion syntax.

# Campaign-local or repo-owned support references. Paths must stay inside the workspace.
checks:
  - path: campaigns/dma-memory-protection-closure-f96de0c2d41b/swb-support/checks/dma_footprint_xsim_tb.sv
    purpose: XSim-compatible directed check of the RTL footprint helpers and setup rejection path.
    prerequisites:
      env:
        PATH_prefix:
          - /data/tools/Xilinx/2025.2.1/Vivado/bin
      notes:
        - The full UVM dma_mem_boundary_vseq remains a separate supported-simulator check.
        - The check requires SYNTHESIS=1 and therefore does not exercise OpenTitan RTL assertions.
configs: []
schemas: []
fixtures: []

# Optional per-entry runtime setup metadata is allowed on swb_tools, repo_tools,
# checks, configs, schemas, and fixtures. It is routing/setup context only.
# Example:
# swb_tools:
#   - tool_id: dvsim-matrix
#     purpose: Matrix runner.
#     prerequisites:
#       notes:
#         - Requires simulator binaries available to the SWB tool runtime.
#
# repo_tools:
#   - path: tools/model-check.sh
#     purpose: Validate local model behavior.
#     prerequisites:
#       env:
#         PATH_prefix:
#           - /opt/systemc/bin
#         vars:
#           SYSTEMC_HOME: /opt/systemc
#       packages:
#         - systemc
#       notes:
#         - Requires systemc-config discoverable on PATH.
#
non_claims:
  - Campaign support discovery does not prove that a referenced check was run.
  - Runtime prerequisites are setup/routing metadata only and do not prove a tool ran successfully.
  - Campaign-local support can change on the same branch as RTL and must be independently reviewed for promotion-relevant claims.
  - Referenced tools, configs, fixtures, and schemas do not prove design correctness, verification sufficiency, or claim acceptance.
